[workspace]
name = "arborx-docs"
version = "0.1.0"
description = "Local documentation build environment for ArborX"
channels = ["conda-forge"]
platforms = ["osx-arm64", "osx-64", "linux-64", "linux-aarch64", "win-64"]

[dependencies]
python = ">=3.12,<3.14"
sphinx = "8.2.*"
furo = "==2025.12.19"
myst-parser = "5.1.*"
sphinx-copybutton = "0.5.*"
sphinx-design = "0.6.*"

[tasks]
docs = "make html"
docs-clean = "make clean"
