name: Documentation

on:
  pull_request:
    types: [opened, reopened, synchronize]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: none

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.13'
      - name: Install documentation dependencies
        run: python -m pip install -r docs/build_requirements.txt
      - name: Build documentation
        working-directory: docs
        run: make html
      - name: Prepare Pages site
        run: |
          mkdir -p "${RUNNER_TEMP}/github-pages/docs"
          cp -a docs/generated_docs/. "${RUNNER_TEMP}/github-pages/docs/"
      - name: Upload documentation as artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          name: github-pages
          path: ${{ runner.temp }}/github-pages/

  deploy:
    if: ${{ github.ref == 'refs/heads/master' }}
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
