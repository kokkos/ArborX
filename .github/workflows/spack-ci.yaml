name: CI [Ubuntu 24.04]

on:
  push:
    branches: [ master ]
    paths-ignore:
      - "docs/**"
  pull_request:
    paths-ignore:
      - "docs/**"

env:
  BUILD_TYPE: Debug

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout
      uses: actions/checkout@v7.0.0
      with:
        path: source

    - name: Set up Spack
      uses: spack/setup-spack@v3.0.0
      with:
        spack_ref: v1.2.2
        packages_ref: v2026.06.0
        buildcache: true
        color: true

    - name: Install Dependencies
      env:
        GITHUB_USER: ${{ github.actor }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        spack -e ${{github.workspace}}/source install

    - name: Configure
      shell: spack-bash {0}
      run: |
        spack env activate ${{github.workspace}}/source
        cmake -S ${{github.workspace}}/source \
              -B ${{github.workspace}}/build \
              -GNinja \
              -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} \
              -D ARBORX_ENABLE_MPI=ON \
              -D ARBORX_ENABLE_TRILINOS=ON \
              -D ARBORX_ENABLE_EXAMPLES=ON

    - name: Build
      run: cmake --build ${{github.workspace}}/build

    - name: Test
      run: ctest --test-dir ${{github.workspace}}/build --output-on-failure
